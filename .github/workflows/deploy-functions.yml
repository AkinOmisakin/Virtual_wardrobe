name: Deploy edge functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# Never run two deploys against the same project at once.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Deploys every function under supabase/functions (remove-background,
      # tag-clothing, try-on, revenuecat-webhook) with JWT verification on
      # (the default).
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      # RevenueCat calls the webhook server-to-server with its own shared
      # secret, not a Supabase user JWT, so the platform gate has to be off or
      # every purchase event 401s. The function verifies the secret itself
      # before touching the ledger. This re-deploy has to come after the bulk
      # step above, which would otherwise leave verification on.
      - name: Redeploy webhook without JWT verification
        run: |
          supabase functions deploy revenuecat-webhook \
            --project-ref "$PROJECT_REF" --no-verify-jwt
